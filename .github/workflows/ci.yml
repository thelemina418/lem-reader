# The blocking gates. PRs and pushes to main retain the three-engine
# reference functional gate; CI runs the lint/format/type/coverage/unit/build
# checks. Nightly evidence (hosted browser matrix, exhaustive reference suite,
# calibration/perf harnesses) lives in evidence.yml and never attaches check
# runs to main — see nightly.yml for how it is dispatched onto the `nightly`
# ref (issue #226: main's check-run surface must stay exactly the gates).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:e2e:coverage
      - run: npm run test:unit -- --run
      - run: npm run build

  e2e-reference:
    runs-on: [self-hosted, macOS, reference]
    timeout-minutes: 90
    # The reference box runs the PR gate AND nightly/manual exhaustive runs,
    # and they must never overlap (2026-10-13: runs 38480319853 +
    # 38480324742 started the same second, load > 40, 3.4x first-attempt
    # inflation on both). Serialization comes from the box itself: exactly
    # ONE runner (`lem-reference`) carries the `reference` label, and GitHub
    # holds every job routed to a busy self-hosted runner in its queue
    # (up to 24h) without canceling any of them.
    #
    # There is deliberately NO job-level concurrency group. The former shared
    # `reference-mac-functional` group (cancel-in-progress: false) kept at
    # most ONE pending job: each newly queued reference job canceled the one
    # already waiting ("Canceling since a higher priority waiting request …
    # exists"), so with two PRs open the older PR's gate — or a nightly — was
    # silently dropped (5 of the last 25 runs, 2026-11-22..25). The
    # workflow-level group above still cancels a superseded run of the SAME
    # ref, which is wanted.
    #
    # Second line of defense: the heavy-test lease step below. If a second
    # `reference` runner is ever registered on this box, overlapping suites
    # still cannot run — the later job waits up to 15 minutes for the lease
    # and then FAILS loudly with the holder's identity. Registering a second
    # runner here therefore needs its own serialization design first.
    env:
      # Reserve a port separate from local development on Vite's default.
      # Keep CI's checked-out server isolated; never reuse that dev server.
      LEM_E2E_BASE: http://localhost:15173
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # Record machine load for the run (duration interpretation requires it;
      # summarize-e2e.mjs cannot know it from the report alone).
      - run: uptime
      - run: node scripts/heavy-lease.mjs status
      - run: npm ci
      - run: npx playwright install
      # Hold the heavy-test lease (issue #255) while the suite runs: CI shares
      # the reference Mac with local agent sessions — the lease file lives in
      # the user cache dir, shared across checkouts and visible to local
      # `heavy-lease.mjs status|run`. The single reference runner already
      # serializes CI's own reference runs; this layer coordinates them with
      # everything else. Contention QUEUES up to 15 minutes (a local targeted
      # run finishing) and only then fails with the holder's identity; a
      # holder can still be deliberately overridden.
      - run: >-
          node scripts/heavy-lease.mjs run --wait-seconds 900
          --owner "ci/e2e-reference/${{ github.run_id }}-${{ github.run_attempt }}"
          -- caffeinate -i npm run test:e2e:pr -- --reporter=line,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: .test-reports/functional.json
      - name: Upload Playwright results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-reference
          include-hidden-files: true
          path: |
            test-results/
            .test-reports/
          retention-days: 7
          if-no-files-found: ignore
