# Factory-run validation (F5 cutover: lemfleet#12). The green verdict on
# this check is produced by the factory's confined F4a guest on the
# lemcentre runner: lem-reader's exact CI unit steps (offline `npm ci` +
# `test:unit`) execute inside the disposable QEMU guest, not on repo CI.
# The runner executes only the root-owned, fail-closed wrapper; repository-
# controlled code never runs outside the guest.
#
# Issue #277 boundary: the wrapper now lives at
# /usr/local/libexec/factory-ci/factory-validate (root-owned, outside the
# desktop home) and enforces the reviewed lemfleet revision recorded in
# ops/lemcentre-runner/lemfleet-rev on every run. The runner itself executes
# as the confined `lemci` account under a hardened system unit — see
# docs/specs/lemcentre-runner-boundary.md.
#
# Rollback (lemfleet#12 + #277 rollback in ops/lemcentre-runner/README.md):
# point branch protection back at `checks` + `e2e-reference`, restore the
# desktop-user runner unit, and point this path back at the old wrapper —
# repo CI regains the gate unchanged.
name: factory-validation

on:
  pull_request:

# One group PER PULL REQUEST. A newer push to the same PR replaces that PR's
# still-pending run, while a run that is already validating in the guest is
# never killed mid-boot (cancel-in-progress: false; the driver plane would
# otherwise strand a spool claim until the stale sweep).
concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  factory-validation:
    runs-on: [self-hosted, lemcentre]
    timeout-minutes: 95
    # There is deliberately NO job-level concurrency group (the #20 lesson,
    # here for the required Lemcentre check). The former global
    # `factory-validation` group kept at most ONE pending job: each newly
    # queued PR's run canceled the one already waiting ("Canceling since a
    # higher priority waiting request for factory-validation exists"), so
    # with two PRs open the older PR's required check was silently dropped
    # (#33 twice on 2026-11-26). Exactly one runner carries the `lemcentre`
    # label, and a busy self-hosted runner already serializes: GitHub holds
    # the jobs routed to it (up to 24h) without canceling any. The heavy-test
    # lease inside the wrapper stays the backstop; registering a second
    # `lemcentre` runner needs its own serialization design first.
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Validate head in the confined factory guest
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          /usr/local/libexec/factory-ci/factory-validate "$HEAD_SHA" "$GITHUB_WORKSPACE"
